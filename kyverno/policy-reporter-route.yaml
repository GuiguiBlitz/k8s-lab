# Policy Reporter UI — listener: policy-reporter (port 9090)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter-ui
  namespace: policy-reporter
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: policy-reporter
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: policy-reporter-ui
          port: 8080
