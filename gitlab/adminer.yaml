apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: gitlab
spec:
  selector:
    app: adminer
  ports:
    - port: 80
      targetPort: 8080
