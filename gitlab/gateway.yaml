# GitLab web UI — listener: gitlab (port 80)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
  namespace: gitlab
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: gitlab
  rules:
    - backendRefs:
        - name: gitlab-webservice-default
          port: 8181
---
# Adminer DB UI — listener: adminer (port 8080)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adminer
  namespace: gitlab
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: adminer
  rules:
    - backendRefs:
        - name: adminer
          port: 80
